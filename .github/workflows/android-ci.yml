name: Android CI

on:
  pull_request:
  push:
    branches: [main, ci/verify-android-build]

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build debug APK and run Android Lint
        run: bash ./gradlew --no-daemon --continue assembleDebug lintDebug

      - name: Upload debug APK
        if: ${{ success() || (!cancelled() && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: truelocal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Android Lint reports
        if: ${{ success() || (!cancelled() && hashFiles('app/build/reports/lint-results-debug.html') != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: error
